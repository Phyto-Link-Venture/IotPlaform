# Local development stack: PostgreSQL + Mosquitto (MQTT broker).
# The API and frontend are typically run with `dotnet run` / `npm run dev` during
# development, but can be brought up here too via the `full` profile.

services:
  postgres:
    image: postgres:16
    container_name: iotplatform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: iotplatform
      POSTGRES_USER: iotplatform
      # Local dev default; override via POSTGRES_PASSWORD in .env (gitignored).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iotplatform"]
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: iotplatform-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"   # MQTT
      - "9001:9001"   # MQTT over WebSockets
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: iotplatform-api
    restart: unless-stopped
    profiles: ["full"]
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=iotplatform;Username=iotplatform;Password=${POSTGRES_PASSWORD:-postgres}"
      Mqtt__Host: "mosquitto"
    ports:
      - "8080:8080"
    volumes:
      - dataprotection-keys:/app/keys

volumes:
  postgres-data:
  mosquitto-data:
  mosquitto-log:
  dataprotection-keys:
