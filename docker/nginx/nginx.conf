# Nginx reverse proxy configuration for IoTPlatform.
# Routes the 4 subdomains (production/staging backend/frontend) to their respective containers.
# TLS is managed by Certbot (see vhost config below).

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss;

    # HTTP redirect to HTTPS + Certbot challenges
    server {
        listen 80;
        server_name iotproductionbackend.phytolink-venture.com iotproductionfrontend.phytolink-venture.com
                   iotstagingbackend.phytolink-venture.com iotstagingfrontend.phytolink-venture.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # Production backend
    server {
        listen 443 ssl http2;
        server_name iotproductionbackend.phytolink-venture.com;

        ssl_certificate /etc/letsencrypt/live/iotproductionbackend.phytolink-venture.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/iotproductionbackend.phytolink-venture.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location / {
            proxy_pass http://iotplatform-api-production:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Production frontend
    server {
        listen 443 ssl http2;
        server_name iotproductionfrontend.phytolink-venture.com;

        ssl_certificate /etc/letsencrypt/live/iotproductionfrontend.phytolink-venture.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/iotproductionfrontend.phytolink-venture.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location / {
            proxy_pass http://iotplatform-frontend-production:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Staging backend
    server {
        listen 443 ssl http2;
        server_name iotstagingbackend.phytolink-venture.com;

        ssl_certificate /etc/letsencrypt/live/iotstagingbackend.phytolink-venture.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/iotstagingbackend.phytolink-venture.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location / {
            proxy_pass http://iotplatform-api-staging:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Staging frontend
    server {
        listen 443 ssl http2;
        server_name iotstagingfrontend.phytolink-venture.com;

        ssl_certificate /etc/letsencrypt/live/iotstagingfrontend.phytolink-venture.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/iotstagingfrontend.phytolink-venture.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location / {
            proxy_pass http://iotplatform-frontend-staging:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
